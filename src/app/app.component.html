<div class="top-menu">

    <img class="logo"
         src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png"
         alt="Angular Academy main logo with small hat">

</div>

<div class="courses">
    @for (course of courses; 
    track $index; 
    ) {
    <course-card  
        [course]="course" 
        [index]="$index+1"
        [class.is-first]="$first"
        [class.is-even]="$even"
        [class.is-odd]="$odd"
        [class.is-last]="$last"
        (courseSelected) = "onCourseSelected($event)" ></course-card>
    }

    @empty {
        <h1>No courses found</h1>
    }
    

</div>
