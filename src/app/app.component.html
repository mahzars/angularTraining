<div class="top-menu">

    <img class="logo"
         src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png"
         alt="Angular Academy main logo with small hat">

</div>

<div class="courses">
    
    <course-card *ngFor="let course of courses; 
    index as i; 
    first as isFirst; 
    even as isEven;
    odd as isOdd;
    last as isLast;"
        [class.is-first]="isFirst"
        [class.is-even]="isEven"
        [class.is-odd]="isOdd"
        [class.is-last]="isLast"
        (courseSelected)="onCourseSelected($event)"
            [course]="course"
            [cardIndex]="i+1"></course-card>
    
</div>
