<div class="top-menu">

    <img class="logo" src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png"
        alt="Angular Academy main logo with small hat">

</div>

<div class="courses" #container>

    <button (click)="onCoursesEdited()">Edit Courses</button>

    <div *ngxUnless="courses.length > 0">No courses available.</div>

    <course-card *ngFor="let course of courses | filterByCategory: beginnerCategory"
        (courseSelected)="onCourseSelected($event)" (courseChanged)="onCourseChanged($event)" [index]="$index"
        [course]="course" [highlighted]="course.category === beginnerCategory">
        <course-image [src]="course.iconUrl"></course-image>
    </course-card>


</div>
